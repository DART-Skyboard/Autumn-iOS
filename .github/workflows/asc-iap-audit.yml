name: ASC IAP + Version Audit (read-only)
on:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Install ASC key
        env:
          ASC_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_NQXQ595W59.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_NQXQ595W59.p8
      - run: pip3 install --quiet 'PyJWT[crypto]>=2.8' requests
      - name: Audit (GET only)
        env:
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          python3 << 'PY'
          import os, time, json, jwt, requests
          from pathlib import Path
          KEY_ID="NQXQ595W59"; ISSUER=os.environ["ASC_ISSUER_ID"]
          key=Path(os.path.expanduser("~/.appstoreconnect/private_keys/AuthKey_NQXQ595W59.p8")).read_text()
          now=int(time.time())
          token=jwt.encode({"iss":ISSUER,"iat":now,"exp":now+1200,"aud":"appstoreconnect-v1"}, key, algorithm="ES256", headers={"alg":"ES256","kid":KEY_ID,"typ":"JWT"})
          H={"Authorization":f"Bearer {token}"}
          def get(path, params=None):
            r=requests.get("https://api.appstoreconnect.apple.com"+path, headers=H, params=params, timeout=90)
            print("GET", path, r.status_code)
            if r.status_code>=400:
              print(r.text[:1500]); return None
            return r.json()
          apps=get("/v1/apps", {"limit":200})
          for app in (apps or {}).get("data",[]):
            aid=app["id"]; at=app["attributes"]
            print("APP", aid, at.get("name"), at.get("bundleId"))
            g=get(f"/v1/apps/{aid}/subscriptionGroups", {"limit":50})
            for grp in (g or {}).get("data",[]):
              print("  GROUP", grp["id"], json.dumps(grp["attributes"]))
              subs=get(f"/v1/subscriptionGroups/{grp['id']}/subscriptions", {"limit":50})
              for s in (subs or {}).get("data",[]):
                a=s["attributes"]; print("    SUB", s["id"], json.dumps({k:a.get(k) for k in ("name","productId","state","subscriptionPeriod","groupLevel")}))
            i=get(f"/v1/apps/{aid}/inAppPurchasesV2", {"limit":50})
            for p in (i or {}).get("data",[]):
              a=p["attributes"]; print("  IAP", p["id"], json.dumps({k:a.get(k) for k in ("name","productId","inAppPurchaseType","state")}))
          PY
